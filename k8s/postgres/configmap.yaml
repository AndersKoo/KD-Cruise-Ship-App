# =============================================================================
# POSTGRESQL DATABASE INITIALISERING
# =============================================================================
# Definerer database skjema og testdata som kjøres ved første oppstart
# Ingen direkte kommunikasjon med Prometheus/Grafana, men data brukes av API

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
data:
  init.sql: |
    -- Opprett bruker og database
    CREATE USER IF NOT EXISTS cruise_user WITH PASSWORD 'cruise_pass';
    GRANT ALL PRIVILEGES ON DATABASE cruise_db TO cruise_user;
    \c cruise_db;

    -- Opprett hovedtabell for cruise events
    CREATE TABLE IF NOT EXISTS planned_events_tab (
        voyage_id VARCHAR(50) NOT NULL,
        vessel_id VARCHAR(50) NOT NULL,
        from_date TIMESTAMP NOT NULL,
        to_date TIMESTAMP NOT NULL,
        event VARCHAR(255) NOT NULL,
        PRIMARY KEY (voyage_id, vessel_id, from_date)
    );

    -- Gi tilgang til brukeren
    GRANT ALL PRIVILEGES ON TABLE planned_events_tab TO cruise_user;

    -- Sett inn eksempeldata for testing og demo
    INSERT INTO planned_events_tab (voyage_id, vessel_id, from_date, to_date, event) VALUES
        ('VOY001', 'VESSEL001', '2024-07-15 08:00:00', '2024-07-15 18:00:00', 'Port Call - Oslo'),
        ('VOY001', 'VESSEL001', '2024-07-16 06:00:00', '2024-07-16 16:00:00', 'Port Call - Bergen'),
        ('VOY002', 'VESSEL002', '2024-07-20 10:00:00', '2024-07-20 20:00:00', 'Port Call - Trondheim'),
        ('VOY002', 'VESSEL002', '2024-07-21 08:00:00', '2024-07-21 18:00:00', 'Port Call - Ålesund'),
        ('VOY003', 'VESSEL001', '2024-07-25 12:00:00', '2024-07-25 22:00:00', 'Port Call - Stavanger')
    ON CONFLICT DO NOTHING;
