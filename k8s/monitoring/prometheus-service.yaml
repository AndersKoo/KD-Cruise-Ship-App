# =============================================================================
# PROMETHEUS SERVICE - NETTVERKSKOBLING FOR DATASOURCE
# =============================================================================
# Dette er IKKE dashboardet - dette er bare nettverkslag som gjør Prometheus tilgjengelig
# Grafana (dashboardet) bruker denne servicen for å koble til Prometheus (datakilden)
# Uten denne servicen kan ikke dashboardet hente data fra Prometheus

apiVersion: v1
kind: Service
metadata:
  name: prometheus-kube-prometheus-prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: web
  selector:
    prometheus: prometheus-kube-prometheus
