# =============================================================================
# SERVICE MONITOR - KONFIGURASJON FOR DATAINNSAMLING
# =============================================================================
# Dette er IKKE dashboardet - dette er konfigurasjon som forteller Prometheus hvor den skal hente data
# ServiceMonitor sikrer at applikasjon-metrics kommer til dashboardet via Prometheus
# Uten denne konfigurasjonen vil dashboardet ikke få data fra planned-events-api

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: planned-events-api-monitor
  namespace: default
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: planned-events-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
