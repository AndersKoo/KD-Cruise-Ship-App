# =============================================================================
# GRAFANA DASHBOARD DEPLOYMENT - DETTE ER DASHBOARDET
# =============================================================================
# Dette ER dashboardet - Grafana er visualiseringsplattformen som viser grafer og metrics
# Grafana leser data fra Prometheus (datakilden) og viser dem som dashboards
# Kommunikasjon: Grafana leser metrics fra Prometheus datasource

# Monitoring Namespace
# -------------------
# Isolerer monitoring komponenter fra andre applikasjoner
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
# Grafana Deployment - DASHBOARD KOMPONENTEN
# -----------------------------------------
# Dette er selve dashboardet som brukere ser og interagerer med
# Grafana kommunikasjon med Prometheus:
# 1. Grafana konfigureres med Prometheus som datasource
# 2. Dashboards viser metrics som Prometheus samler inn
# 3. Grafana kan også vise alerts fra Prometheus
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: 'admin'
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: 'admin123'
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc

---
# Grafana Service - TILGANG TIL DASHBOARDET
# -----------------------------------------
# LoadBalancer service for ekstern tilgang til Grafana dashboardet
# Grafana dashboardet er tilgjengelig på http://localhost:3000
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: grafana

---
# Grafana Persistent Volume Claim - DASHBOARD PERSISTENCE
# ------------------------------------------------------
# Sikrer at dashboards og konfigurasjon ikke går tapt ved restart
# Dette bevarer dashboard-innstillinger og brukerdata
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
